<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Demo: Με και Χωρίς Συνάρτηση</title>
</head>
<body>

  <h2>Σύγκριση: Χωρίς και Με Συνάρτηση</h2>
  <p>Πάτησε ένα από τα δύο κουμπιά για να δεις πώς λειτουργεί ο υπολογισμός.</p>

  <button onclick="withoutFunction()">Χωρίς Συνάρτηση</button>
  <button onclick="withFunction()">Με Συνάρτηση</button>

  <hr>

  <p id="output"></p>

  <script>
    // 1️⃣ Εκδοχή χωρίς συνάρτηση
    function withoutFunction() {
      let price = 100;
      let discount = 0.2;
      let finalPrice = price - (price * discount);

      document.getElementById("output").innerHTML =
        `💸 <b>Χωρίς συνάρτηση</b><br>Αρχική: ${price}€, Έκπτωση: ${discount * 100}%, Τελική: <b>${finalPrice}€</b>`;
    }

    // 2️⃣ Εκδοχή με συνάρτηση
    function calculateFinalPrice(price, discount) {
      let finalPrice = price - (price * discount);
      return finalPrice;
    }

    function withFunction() {
      let result1 = calculateFinalPrice(120, 0.15);
      let result2 = calculateFinalPrice(80, 0.1);
      let result3 = calculateFinalPrice(200, 0.25);

      document.getElementById("output").innerHTML =
        `🧮 <b>Με συνάρτηση</b><br>` +
        `1️⃣ Προϊόν 1: 120€ με 15% → ${result1}€<br>` +
        `2️⃣ Προϊόν 2: 80€ με 10% → ${result2}€<br>` +
        `3️⃣ Προϊόν 3: 200€ με 25% → ${result3}€`;
    }
  </script>

</body>
</html>
