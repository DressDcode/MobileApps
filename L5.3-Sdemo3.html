<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Interactive Flow Control Demo</title>
</head>
<body>
  <h2>Άνοιξε την κονσόλα (F12 → Console) και ακολούθησε τις οδηγίες</h2>

  <script>
    console.log("=== ΕΝΑΡΞΗ INTERACTIVE DEMO ===\n");

    // 1️⃣ IF / ELSE / ELSE IF
    console.log("1️⃣ Παράδειγμα if / else / else if");

    let priceInput = prompt("Δώσε τιμή προϊόντος σε ευρώ:");
    let price = Number(priceInput);

    if (price >100 && price <= 200) {
      console.log("Ακριβό προϊόν!");
    } else if (price >= 50 && price <= 100) {
      console.log("Μεσαίας κατηγορίας προϊόν.");
	}  else if (price >200) {
      console.log("Μάλιστα... το φυσάμε το χρήμα...");
    } else if (price > 0) {
      console.log("Οικονομικό προϊόν!");
    } else {
      console.log("Μη έγκυρη τιμή.");
    }

    console.log("-----------------------------");

    // 2️⃣ SWITCH
    console.log("2️⃣ Παράδειγμα switch");

    let day = prompt("Δώσε ημέρα εβδομάδας (π.χ. Δευτέρα):");

    switch (day) {
      case "Δευτέρα":
        console.log("Καλή αρχή της εβδομάδας!");
        break;
      case "Παρασκευή":
        console.log("Καλό Σαββατοκύριακο!");
        break;
      case "Κυριακή":
        console.log("Ξεκούραση και καφές!");
        break;
      default:
        console.log("Μια συνηθισμένη μέρα εργασίας.");
    }

    console.log("-----------------------------");

    // 3️⃣ FOR LOOP
    console.log("3️⃣ Παράδειγμα for loop");

    let times = prompt("Πόσες φορές να επαναλάβω το μήνυμα; (π.χ. 3)");
    times = Number(times);

    for (let i = 1; i <= times; i++) {
      console.log(`Επανάληψη #${i}: Καλώς ήρθες στο demo!`);
    }

    console.log("Το for loop ολοκληρώθηκε.\n");

    console.log("-----------------------------");

    // 4️⃣ WHILE LOOP
    console.log("4️⃣ Παράδειγμα while loop");

    let countdown = 5;
    console.log("Ξεκινάμε αντίστροφη μέτρηση:");

    while (countdown > 0) {
      console.log(countdown);
      countdown--;
    }

    console.log("Έναρξη! 🚀");
    console.log("=== ΤΕΛΟΣ DEMO ===");
  </script>
</body>
</html>
