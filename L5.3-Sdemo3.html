<!DOCTYPE html>
<html>
<head>
  <title>Υπολογισμός Έκπτωσης</title>
</head>
<body>
  <script>
    // Δήλωση μεταβλητών
    let price = 100;        // Αρχική τιμή
    let discount = 0.2;     // 20% έκπτωση

    // Υπολογισμός τελικής τιμής
    let finalPrice = price - (price * discount);

    // Εμφάνιση αποτελέσματος
    alert(`Η τελική τιμή είναι: ${finalPrice}€`);
    console.log(`Αρχική: ${price}, Έκπτωση: ${discount * 100}%, Τελική: ${finalPrice}`);
  </script>
</body>
</html>
