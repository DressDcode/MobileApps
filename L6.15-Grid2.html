<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Grid Demo - Βήμα 1</title>
  <style>
    .container {
      display: grid;
	  grid-template-columns: 200px 1fr 2fr;
    }

    .item {
      background: #e0e0e0;
      padding: 20px;
      border: 1px solid #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>

</body>
</html>
