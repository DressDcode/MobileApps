<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Έλεγχος Ονόματος</title>
</head>
<body>
  <h1>Demo Ελέγχου Ονόματος</h1>

  <input type="text" id="name" placeholder="Όνομα">
  <button id="submitBtn">Αποστολή</button>

  <script>
    const nameInput = document.getElementById("name");
    const submitBtn = document.getElementById("submitBtn");

    submitBtn.addEventListener("click", () => {
      if (nameInput.value.trim() === "") {
        alert("Παρακαλώ γράψε το όνομά σου!");
      } else {
        alert(`Καλωσήρθες, ${nameInput.value}!`);
      }
    });
  </script>
</body>
</html>
