<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Grid Demo - Βήμα 4</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
	  gap: 20px;
    }
    .item {
      background: #e0e0e0;
      padding: 20px;
      border: 1px solid #bbb;
      text-align: center;
    }
    /* Το Item 1 θα καταλάβει 2 στήλες: από την 1 έως την 3 */
    .item:first-child {
      grid-column: 1 / 3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    <div class="item">Item 4</div>
    <div class="item">Item 5</div>
    <div class="item">Item 6</div>
  </div>
</body>
</html>
