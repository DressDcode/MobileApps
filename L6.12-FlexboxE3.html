<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Παράδειγμα</title>
  <style>
    .cards {
      display: flex;              /* ενεργοποιεί το flexbox */
	  flex-direction: row;        /* οριζόντια διάταξη */ 
	  justify-content: flex-start;   /* οριζόντια τοποθέτηση */
      gap: 10px;                  /* κενό ανάμεσα στις κάρτες */
	  flex-wrap:wrap;			  /* επιτρέπει σπάσιμο σε γραμμές */ 
	  }

    .cards article {
	  flex: 1;          /* = flex: 1 1 0; */
      padding: 20px;
      background: lightblue;
      text-align: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="cards">
    <article>Κάρτα 1 - Υπηρεσίες</article>
    <article>Κάρτα 2</article>
    <article>Κάρτα 3 - Εργασίες υποστήριξης</article>
  </div>
</body>
</html>
</html>
