<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>Demo justify-content</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: .5rem;
    }

    .controls {
      margin-bottom: 1rem;
    }

    .controls button {
      margin: 0 .25rem .25rem 0;
      padding: .35rem .7rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: .9rem;
    }

    .controls button.active {
      background: #0056b3;
      color: #fff;
      border-color: #00408a;
    }

    .container-label {
      margin-bottom: .3rem;
      font-size: .9rem;
      color: #555;
    }

    .flex-demo {
      display: flex;
      border: 2px dashed #999;
      border-radius: 6px;
      padding: 10px;
      background: #fff;
      min-height: 70px;
      transition: all .25s ease;
    }

    .item {
      width: 60px;
      height: 40px;
      border-radius: 4px;
      background: #ffcc80;
      border: 1px solid #ffb74d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
    }

    .note {
      margin-top: .8rem;
      font-size: .85rem;
      color: #555;
    }

    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <h1>justify-content demo</h1>

  <div class="controls">
    <strong>Επίλεξε τιμή:</strong>
    <button data-mode="flex-start" class="active">flex-start</button>
    <button data-mode="center">center</button>
    <button data-mode="flex-end">flex-end</button>
    <button data-mode="space-between">space-between</button>
    <button data-mode="space-around">space-around</button>
    <button data-mode="space-evenly">space-evenly</button>
  </div>

  <div class="container-label">
    justify-content: <code id="mode-label">flex-start</code>
  </div>

  <div id="demo" class="flex-demo" style="justify-content:flex-start;">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <p class="note">
    Παρατήρησε πώς αλλάζει η κατανομή του κενoύ χώρου κατά μήκος του βασικού άξονα
    όταν αλλάζει η τιμή της <code>justify-content</code>.
  </p>

  <script>
    const demo = document.getElementById("demo");
    const label = document.getElementById("mode-label");
    const buttons = document.querySelectorAll(".controls button");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const mode = btn.getAttribute("data-mode");

        // ενημέρωση flex
        demo.style.justifyContent = mode;
        label.textContent = mode;

        // ενημέρωση ενεργού κουμπιού
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  </script>
</body>
</html>
