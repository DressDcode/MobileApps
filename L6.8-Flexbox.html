<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Παράδειγμα</title>
  <style>
    .cards {
      display: flex;              /* ενεργοποιεί το flexbox */
	  flex-direction: row;        /* οριζόντια διάταξη */ 
	 }

    .cards article {
      padding: 20px;
      background: lightblue;
      text-align: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="cards">
    <article>Κάρτα 1 - Υπηρεσίες</article>
    <article>Κάρτα 2</article>
    <article>Κάρτα 3 - Εργασίες υποστήριξης</article>
  </div>
</body>
</html>
