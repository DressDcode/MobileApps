<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Διαδραστικό Demo: Box Model (margin, border, padding)</title>
<style>
  :root{
    --bg:#f8fafc;--panel:#ffffff;--border:#e2e8f0;--accent:#2563eb;--text:#0f172a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1{text-align:center;margin:24px;font-size:clamp(20px,3.5vw,28px)}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:10px 0}
  label{font-weight:600;font-size:14px}
  input[type="range"]{width:200px}
  .chip{display:inline-block;background:#f1f5f9;border:1px solid var(--border);border-radius:999px;padding:4px 8px;font-size:12px;color:#334155}
  #container{background:#e2e8f0;padding:40px;border-radius:14px;margin-top:10px;transition:all .2s}
  #box{
    background:#93c5fd;
    color:#1e3a8a;
    text-align:center;
    border:4px solid #1d4ed8;
    padding:20px;
    margin:20px auto;
    width:200px;
    border-radius:8px;
    transition:all .25s ease;
  }
  code{background:#f1f5f9;padding:2px 6px;border-radius:6px}
  .hint{font-size:13px;color:#64748b;margin-top:6px}
</style>
</head>
<body>
  <h1>Διαδραστικό Demo: <code>margin</code>, <code>border</code>, <code>padding</code></h1>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <label>padding: <span id="padVal" class="chip">20px</span></label>
        <input type="range" id="padding" min="0" max="60" value="20" />
      </div>
      <div class="row">
        <label>border-width: <span id="bordVal" class="chip">4px</span></label>
        <input type="range" id="border" min="0" max="20" value="4" />
      </div>
      <div class="row">
        <label>margin: <span id="margVal" class="chip">20px</span></label>
        <input type="range" id="margin" min="0" max="60" value="20" />
      </div>
      <div class="hint">🔹 Το <b>padding</b> είναι εσωτερικό κενό.<br>
      🔹 Το <b>border</b> είναι το πλαίσιο.<br>
      🔹 Το <b>margin</b> είναι εξωτερική απόσταση από άλλα στοιχεία.</div>
    </div>

    <div id="container">
      <div id="box">
        <strong>BOX</strong><br>
        περιεχόμενο
      </div>
    </div>
  </div>

<script>
  const box = document.getElementById('box');
  const pad = document.getElementById('padding');
  const bord = document.getElementById('border');
  const marg = document.getElementById('margin');
  const padVal = document.getElementById('padVal');
  const bordVal = document.getElementById('bordVal');
  const margVal = document.getElementById('margVal');

  function updateBox(){
    box.style.padding = pad.value + 'px';
    box.style.borderWidth = bord.value + 'px';
    box.style.margin = marg.value + 'px auto';
    padVal.textContent = pad.value + 'px';
    bordVal.textContent = bord.value + 'px';
    margVal.textContent = marg.value + 'px';
  }

  [pad,bord,marg].forEach(el => el.addEventListener('input', updateBox));
  updateBox();
</script>
</body>
</html>
